# Pure Live workspace (docs/specs/ENGINEERING.md §3). Members are added one refactored
# module at a time and share this directory's pubspec.lock. Dependency
# overrides may only be declared here.
name: pure_live_workspace
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - apps/pure_live
  - packages/live_cast
  - packages/live_core
  - packages/live_danmaku
  - packages/live_iptv
  - packages/live_media
  - packages/live_net
  - packages/live_player
  - packages/live_record
  - packages/live_store
  - packages/live_ui
  - packages/live_vod
  - tools/check_latest
  - tools/live_cli

# Overrides apply to the whole workspace and may only be declared here.
dependency_overrides:
  # flutter_webrtc 1.6.3 with track-scoped Android projection-stop events.
  # Source, license and minimal patch are in PURELIVE_PATCH.md.
  flutter_webrtc:
    path: third_party/flutter_webrtc
  # Self-maintained fork of Predidit/media-kit (toolchain.env pins the
  # upstream commit; patches in third_party/media_kit_video/PURELIVE_PATCH.md).
  media_kit:
    path: third_party/media_kit
  media_kit_video:
    path: third_party/media_kit_video
  # The fork pins these below their latest stable releases (media_kit: xml
  # ^6.5.0; media_kit_video: wakelock_plus 1.3.3) but only uses APIs that are
  # unchanged in the latest ones (XmlDocument in the Apple hook;
  # WakelockPlus.enable/disable).
  wakelock_plus: ^1.8.2
  xml: ^7.1.0
  # Flutter 3.50.1's flutter_test pins test_api 0.7.14, below what test 1.33.0
  # (the pure Dart members) needs exactly 0.7.15; flutter_test runs on it.
  test_api: 0.7.15
  # The Linux build offers no in-app browser (InAppWeb.available is false);
  # this stand-in has no native code, so it does not need WPE WebKit (X02.1).
  flutter_inappwebview_linux:
    path: third_party/flutter_inappwebview_linux_stub
  # The newest recorder hook needs code_assets 2.2.0. Keep one workspace
  # version shared with the media_kit Native Assets hook.
  code_assets: 2.2.0
  # connectivity_plus 7.3.2 (the app's network type, M12.3) declares
  # nm ^0.5.0, whose dbus ^0.7.0 conflicts with wakelock_plus 1.8.1's
  # dbus ^0.8.0. nm 0.6.0 is the same NetworkManager client on dbus 0.8 and
  # is only used on Linux (3.x shipped the same override).
  nm: 0.6.0
  # bonsoir 7.1.5's Linux part (device sync's mDNS, M12.3) declares
  # dbus ^0.7.12; the Avahi calls it makes are unchanged in dbus 0.8.0, which
  # wakelock_plus 1.8.1 needs (3.x shipped the same override). Linux only.
  dbus: 0.8.1

# Native FFmpeg of the recorder (apps/pure_live depends on
# ffmpeg_kit_extended_flutter 1.0.2, native API FFmpegKit 0.11.2). The
# plugin's build hook reads this block from the pubspec next to
# .dart_tool/package_config.json, which in a pub workspace is this one. The
# bundles are our FFmpeg 9.1 builds for that API (release
# native-ffmpeg-9.1-b1, listed with their SHA-256 in
# tools/ffmpeg_kit/bundles.txt; rebuilt with tools/ffmpeg_kit/rebuild/ and the
# FFmpegKit Apple workflow). The hook downloads a remote URL on every build,
# so the paths are local (relative to this file): run
# tools/ffmpeg_kit/fetch.sh (WSL/Linux) or fetch.ps1 (Windows) once after
# cloning; it downloads into a cache outside the repository only what is
# missing and links it into the git-ignored .ffmpeg_kit/. Never committed.
ffmpeg_kit_extended_config:
  type: base
  gpl: false
  small: false
  android: .ffmpeg_kit/bundle-base-shared-lgpl-release.aar
  windows: .ffmpeg_kit/bundle-base-windows-x86_64-shared-lgpl.zip
  linux: .ffmpeg_kit/bundle-base-linux-x86_64-shared-lgpl.zip
  ios: .ffmpeg_kit/bundle-base-ios-universal-lgpl.xcframework.zip
  macos: .ffmpeg_kit/bundle-base-macos-universal-lgpl.xcframework.zip
