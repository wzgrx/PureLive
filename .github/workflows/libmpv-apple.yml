name: Libmpv Apple
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  slice:
    strategy:
      fail-fast: false
      matrix:
        target: [ios-arm64, ios-sim-arm64, ios-sim-x64, macos-arm64, macos-x64]
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official stable Python
        run: bash tools/toolchain/macos_python.sh
      - name: Select stable Apple toolchain
        run: bash tools/toolchain/apple.sh
      - name: Prepare native tools
        run: bash tools/native/libmpv_apple/prepare.sh
      - name: Build native slice
        run: python3 tools/native/libmpv_apple/build.py --target "${{ matrix.target }}" --work "$RUNNER_TEMP/purelive-player" --output "$GITHUB_WORKSPACE/slice-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-slice-${{ matrix.target }}
          path: slice-dist
          if-no-files-found: error
          compression-level: 0
  pack:
    needs: slice
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official stable Python
        run: bash tools/toolchain/macos_python.sh
      - name: Select stable Apple toolchain
        run: bash tools/toolchain/apple.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libmpv-slice-*
          path: slice-input
      - name: Validate and assemble same-source frameworks
        run: |
          set -euo pipefail
          python3 tools/native/libmpv_apple/pack_slices.py --slices "$GITHUB_WORKSPACE/slice-input" --output "$GITHUB_WORKSPACE/player-dist" --work "$RUNNER_TEMP/player-pack"
          (cd player-dist && shasum -a 256 *.tar.gz provenance.json | tee SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-apple
          path: player-dist
          if-no-files-found: error
          compression-level: 0
