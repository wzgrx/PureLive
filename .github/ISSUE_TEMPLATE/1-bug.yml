name: 问题反馈 / Bug report
description: 闪退、打不开、功能不正常、界面显示错误。某个直播平台打不开请用“直播平台失效”。
title: "[问题] "
labels: ["bug", "待分类"]
body:
  - type: markdown
    attributes:
      value: |
        当前只维护已有功能的bug和稳定性；直播回放已停止维护和更新，相关需求与回放专项故障会说明后关闭。新功能请按[维护方针](https://github.com/wzgrx/PureLive/blob/master/MAINTENANCE.md)自行完成PR。
  - type: markdown
    attributes:
      value: |
        感谢反馈。为了能复现和修好，下面带红色星号的都必须填写；信息不全的 issue 会标“需要补充信息”，14 天没有补充会关闭（补充后可以重开）。流程见 [CONTRIBUTING.md](https://github.com/wzgrx/PureLive/blob/master/CONTRIBUTING.md)。

        - 一个 issue 只写一个问题，多个问题请分开提交。
        - 某个**直播平台**打不开、没弹幕、搜不到、登录失败，请改用“直播平台失效”模板。
        - **不要**贴 Cookie、令牌、账号、手机号、真实 IP；日志里的 Cookie 和令牌应用已经去掉，贴之前再看一眼。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经在 [Issues](https://github.com/wzgrx/PureLive/issues?q=is%3Aissue) 里搜索过（包括已关闭的），没有相同的问题
          required: true
        - label: 我用的是[最新版本](https://github.com/wzgrx/PureLive/releases/latest)，问题仍然存在
          required: true
        - label: 这个 issue 只写了一个问题
          required: true
        - label: 我贴出的内容里没有 Cookie、令牌、账号密码等敏感信息
          required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 在“设置 → 关于”里看，例如 `5.4.4（5108）`。
      placeholder: 5.4.4（5108）
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 使用的端
      options:
        - Android 手机
        - Android 平板或折叠屏
        - Android 电视或盒子
        - Windows
        - Linux
        - macOS
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: 安装包
      description: 下载的是发布页上哪个文件；不是从这里下载的请写明来源。
      placeholder: PureLive-5.4.4-5108-debug-signed-android-arm64-v8a-release.apk
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备和系统
      description: 机型、系统和版本。电视写品牌型号；电脑写系统版本。
      placeholder: 红米 K90 Pro Max，HyperOS 3（Android 16）/ Windows 11 24H2 / Ubuntu 24.04（Wayland）
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 全新安装
        - 从 3.x 覆盖安装
        - 从 4.x 覆盖安装
        - 从更早的 5.x 覆盖安装
        - 不清楚
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 问题所在
      options:
        - 闪退或打不开
        - 播放（黑屏、卡顿、没声音、断流、清晰度和线路）
        - 弹幕
        - 录制
        - 关注列表和开播提醒
        - 小窗、画中画、后台播放
        - 多画面或投屏
        - 网络电视（IPTV）
        - 登录和账号
        - 设置、备份、导入导出
        - 界面显示（错位、遮挡、文字截断）
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 看到了什么。屏幕上有提示文字的，请原样抄下来。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，一步一步写，别人照做能看到同样的问题。
      placeholder: |
        1. 打开应用，进“关注”
        2. 点哔哩哔哩的某个直播间
        3. 点右下角全屏
        4. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 正常应该是什么样。
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都出现
        - 经常（一半以上）
        - 偶尔
        - 只出现过一次
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: 以前的版本正常吗
      options:
        - 3.x 正常
        - 上一个版本正常（请在下面写版本号）
        - 一直都有这个问题
        - 不清楚
    validations:
      required: false
  - type: input
    id: room
    attributes:
      label: 直播间链接
      description: 和某个直播间有关时必填（播放、弹幕、录制问题都算）。
      placeholder: https://live.bilibili.com/6
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: 日志
      description: |
        播放、闪退、登录问题请一定附上。导出方法：设置 → 日志管理 →“记录等级”选“调试”→ 重新操作一遍出问题的步骤 → 回到日志管理点“导出/分享”。日志较长时请作为附件上传（拖进下面的“其他”框）。
        应用打不开时：启动失败页会显示日志保存的位置，把那个文件附上。
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 截图、录屏和其他信息
      description: 截图或录屏可以直接拖进来。网络环境（代理、VPN、公司网络）、改过的设置也写在这里。
    validations:
      required: false
