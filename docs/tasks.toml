note = "用户选了方案 A（K90 原型截图 + issue 里 iPhone 截图做的示意）。① 玻璃胶囊下方不再是“整个底部安全区 + 12”：GlassMetrics.barGap 按系统底部区域算，iOS 的横条在 34 的底部，胶囊离底边 20（iPad 至少 12）；Android 的手势横条在区域中间，胶囊在它上面 6（24 → 20、16 → 16）；Android 三键导航（区域超过 40）照旧在按钮上面 12；没有底部区域（K90 隐藏横条、桌面窄窗口）照旧 12。② 新设置“紧凑底栏”（homeBottomBarCompact，外观 → 主题，默认关）：普通底栏 64（Material 默认 80），玻璃胶囊 56（原来 68），LiquidGlassBar 加 height，圆角和水滴跟着高度走。15 种语言。测试：liquid_glass_bar_test（barGap 各种底部区域、56 高胶囊大字号不溢出），home_test V02.11（iPhone 34：胶囊离底 20、紧凑 56、普通底栏 64、大字号不溢出；Android 三键 48：离底 60；没有区域：12），A01.5 用例的数字随 ① 更新。iOS 普通底栏图标文字“偏上”是 Material 底栏本身的排法（80 高 + 下面 34 的横条区域），紧凑后矮 16；玻璃“不够圆润”这次不改"

