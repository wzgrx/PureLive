note = "#8 根因：DialogKeys 打开对话框时让一个普通 Focus 拿焦点，所有按钮都在它自己的区域里，方向键从它往外找、什么也找不到；遥控器没有 Tab，确认键对它也没用。电视上能打开的手机对话框（66 处 AppDialog、更新提示、关闭确认）都这样。改成 FocusScope：外壳拿着焦点时方向键走 Flutter 的“作用域里按方向找第一个”，确认键先把焦点移到第一个控件、不直接按主按钮；键盘 Enter 照旧。测试：dialog_support_test（撤掉修复时“下”进不去）、remote_sync_test 用真实的发送对话框从上往下逐行走到“发送”、确认键勾选和发送（撤掉修复时失败）。K90 切到电视界面、锁横屏、只用 DPAD 键：逐行下到按钮，左右在取消和发送之间移动，确认键关掉对话框；测完恢复界面模式“自动”和自动旋转。#7：Flutter 3.47 最低 iOS 15（构建工具把最低版本改成 15.0），不能支持 iPadOS 14；README 写明 TrollStore 在 14 上能装但打不开，V04 记一条，发布说明的“下载哪个”从 5.4.7 起写 iOS 和 macOS 的最低版本"

