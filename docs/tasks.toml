note = "根因：拖动时每个移动事件都用 animateWith 给水滴重新开一个弹簧；控制器重新开始后第一帧的时间是 0，位置不动。手机一般每帧送一个移动事件，于是手指一直动、水滴几乎每帧都停着，手指停下才追上去，看着一卡一卡；触控上报越密越明显。改成拖动中只移动正在跑的弹簧的终点（_MovingSpring：从上一帧的位置和速度接着走，时钟不重开），点按、松手归位照旧。测试 liquid_glass_bar_test issue #11：每帧移动一次手指，水滴每帧都往前（换回旧代码时水滴一直停在 50）"

