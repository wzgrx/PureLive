done = 3
note = "等 O01.1 在真机上用一段时间、用户还想更及时时再做；最短 15 分钟、系统决定实际时间，HyperOS 可能延后或不跑；不用精确闹钟（SCHEDULE_EXACT_ALARM 只给闹钟和日历类应用）；2026-10-15 按 V01.1 L1、L14：等 O01.1 用一段时间、用户还想更及时时再做（HyperOS 上 WorkManager 不可靠）；2026-10-15 用户要求现在做（5.1.0）：WorkManager 周期任务（15 分钟，要联网，系统决定实际时间）起一个独立 Flutter 引擎跑 `app/live_alert_worker.dart`，不开数据库、不用 Cookie 和代理（内存里的存储）；和应用共用 `live_alert_watch.json`（要提醒的关注、显示名、各房间已知状态、通知文字、应用下一次自己查的时间），应用自己在查时后台跳过，两边都先合并对方看到的状态再判断，同一场直播只提醒一次；新设置“应用被清理后也检查”（liveAlertBackground，默认开，只在开播提醒开着时起作用）；2026-10-15 K90 真机：周期任务登记成功；HyperOS 默认拒绝在应用被清理后拉起任务（AutoStartManagerService Reject service），允许“自启动”后，应用界面被清理的情况下 13:49 后台检查自己运行，发出“老实憨厚的笑笑 开播了”通知并写回状态；所以设置说明写明小米等手机要先在“后台播放设置”里打开自启动；2026-10-18（5.4.3 发布后门禁里一次失败查出）：`live_alert_watch.json` 每次写都用同一个临时文件 `.tmp`，应用启动时两次写同时进行（或应用和后台检查同时写）会互相截断，后一次改名失败、文件留在旧状态，后台检查可能把已知的直播间当成第一次见而不提醒；改成每次写用自己的临时文件、同一处的写按顺序排队（5.4.3 里还有这个问题，下个版本带上）"

