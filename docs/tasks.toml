[[task]]
id = "G02.4"
title = "部分哔哩哔哩直播间打开后“视频解码器运行时错误”、自动恢复两次后显示“播放器异常”"
type = "功能"
status = "完成"
size = "小"
tier = 1
date = "2026-10-20"
from = "用户 2026-10-20：视频解码器运行时错误，分析根本原因，解决问题以后，在更新（5.4.5 发版前 K90 冒烟发现，5.4.4 同样复现）"
note = "根因（K90，mpv 详细日志）：Android 用 mediacodec-copy 硬解，FFmpeg 每次打开 MediaCodec 都在 error 级别打出“Both surface and native_window are NULL”（这种模式本来就不给 surface，随后正常启动、出帧），分类规则见到 mediacodec 就算解码错误；首帧后画面输出接上 GPU、视频链路重建，这路流（哔哩哔哩赛事 21144080、5271，H.264 High 720p，软件解码 25 秒无任何错误）短暂重新缓冲，1.2 秒窗口到期时还在缓冲，于是误判并重开；重开时旧连接被掐断的残包（Invalid NAL、missing picture）在新流打开期间被暂存，新流打开慢（1.6 秒），又被当成新流的错误，第二次恢复后报“播放器异常”。修：这行提示不参与判断（NativeDiagnosticGate.isActionable）；打开期间暂存的解码器那几行等新流开始播放或出帧后才计时，它的解码器已出画面或声音就丢掉（来源级错误照旧）。测试 diagnostics_test 两条（修前失败）。K90 修后：21144080 三次、5271 两次都直接播放、没有一次恢复；虎牙、斗鱼照常。"

